<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilhete</title>
<style>
  html,body{margin:0;height:100%;background:#1a1614}
  body{display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:Georgia,"Times New Roman",serif}
  .papel{background:#efe6d2;color:#2b2520;max-width:340px;width:100%;padding:28px 26px;border-radius:3px;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.7);transform:rotate(-1.5deg);line-height:1.6;font-size:18px}
  .papel p{margin:0 0 12px}
  .assinatura{text-align:right;font-style:italic}
</style></head>
<body>
  <!-- EXEMPLO: copie esta pasta, renomeie e troque o texto -->
  <div class="papel">
    <p>Este é um bilhete de exemplo.</p>
    <p>Copie a pasta <b>bilhete-exemplo</b>, dê outro nome e troque este texto.</p>
    <p class="assinatura">— o mestre</p>
  </div>
</body></html>
