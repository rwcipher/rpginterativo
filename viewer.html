<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Interação</title>
<link rel="stylesheet" href="estilo.css">
<style>
  body{display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  header h1{flex:1;font-size:14px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .ao-vivo{font-size:11px;font-weight:700;color:#1b1530;background:var(--accent);border-radius:999px;padding:3px 9px;white-space:nowrap}
  header button{padding:5px 11px;font-size:12px}
  iframe{flex:1;width:100%;border:0;background:#000}
</style></head>
<body>
<header>
  <h1 id="t"></h1>
  <span class="ao-vivo" id="tag" hidden></span>
  <button id="encerrar" class="perigo" hidden>Encerrar p/ todos</button>
  <button id="fechar" hidden>✕ Fechar</button>
</header>
<iframe id="f" title="Conteúdo" allow="autoplay"></iframe>
<script type="module">
import OBR from "./vendor/obr-sdk.js";
import { MODAL_VIEWER, MODAL_ESPELHO, CANAL_ESP, CANAL_LOCAL } from "./comum.js";

const q = new URLSearchParams(location.search);
const modo = q.get("modo") || "normal";      // "normal" = quem usa | "espelho" = quem assiste
const sessao = q.get("sessao");
const espelhar = q.get("espelhar") || "nao";
const dono = q.get("dono") || "";
const itemId = q.get("item");
const $ = (id) => document.getElementById(id);
const frame = $("f"), tag = $("tag"), btnFechar = $("fechar"), btnEncerrar = $("encerrar");
$("t").textContent = q.get("titulo") || "";

let src = q.get("src") || "about:blank";
if (modo === "espelho") src += (src.includes("?") ? "&" : "?") + "espelho=1";

// Onde a pessoa parou (fica salvo no navegador dela, por objeto)
const CHAVE = itemId ? `rpg-estado:${itemId}` : null;
const lerSalvo = () => { try { return JSON.parse(localStorage.getItem(CHAVE)); } catch { return null; } };
const salvar = (e) => { try { CHAVE && localStorage.setItem(CHAVE, JSON.stringify(e)); } catch {} };

OBR.onReady(async () => {
  const papel = await OBR.player.getRole();
  const enviar = (d, destino = "REMOTE") => OBR.broadcast.sendMessage(CANAL_ESP, { sessao, ...d }, { destination: destino }).catch(() => {});
  const local = (d) => OBR.broadcast.sendMessage(CANAL_LOCAL, d, { destination: "LOCAL" }).catch(() => {});
  let fechandoDeVerdade = false;

  // ================= QUEM USA =================
  if (modo === "normal") {
    btnFechar.hidden = false;
    const salvo = lerSalvo();
    let ultimo = salvo;
    let restaurando = !!salvo;   // enquanto restaura, ignora a tela de bloqueio inicial

    // Reabre onde parou
    frame.addEventListener("load", () => {
      if (!restaurando || frame.src === "about:blank" || !frame.src) return;
      frame.contentWindow?.postMessage({ tipo: "rpg-restaurar", estado: salvo }, "*");
      restaurando = false;
    });

    window.addEventListener("message", (e) => {
      if (e.source !== frame.contentWindow || e.data?.tipo !== "rpg-estado") return;
      if (restaurando) return;
      ultimo = e.data.estado;
      salvar(ultimo);
      if (sessao && espelhar !== "nao") enviar({ tipo: "estado", estado: ultimo });
    });

    if (sessao && espelhar !== "nao") {
      tag.hidden = false;
      tag.textContent = espelhar === "todos" ? "● ao vivo p/ sala" : "● ao vivo p/ mestre";
      enviar({ tipo: "abrir", para: espelhar, src: q.get("src"), titulo: q.get("titulo"), dono });
      OBR.broadcast.onMessage(CANAL_ESP, ({ data }) => {
        if (data?.sessao !== sessao) return;
        if (data.tipo === "pedir" && ultimo) enviar({ tipo: "estado", estado: ultimo });
        if (data.tipo === "forcar-fechar") { fechandoDeVerdade = true; OBR.modal.close(MODAL_VIEWER); }
      });
    }

    btnFechar.onclick = async () => {
      fechandoDeVerdade = true;
      if (sessao && espelhar !== "nao") await enviar({ tipo: "fechar" }, "ALL");
      OBR.modal.close(MODAL_VIEWER);
    };

    // Fechou sem ser pelo botão (clique fora): volta a abrir no mesmo ponto
    window.addEventListener("pagehide", () => {
      if (!fechandoDeVerdade && sessao) local({ tipo: "reabrir-usuario", busca: location.search });
    });
  }

  // ================= QUEM ASSISTE =================
  else {
    tag.hidden = false;
    tag.textContent = `👁 ${dono || "player"} usando`;
    if (papel === "GM") { btnFechar.hidden = false; btnEncerrar.hidden = false; }   // players só assistem

    OBR.broadcast.onMessage(CANAL_ESP, ({ data }) => {
      if (data?.sessao !== sessao) return;
      if (data.tipo === "estado") frame.contentWindow?.postMessage({ tipo: "rpg-aplicar", estado: data.estado }, "*");
      if (data.tipo === "fechar" || data.tipo === "forcar-fechar") { fechandoDeVerdade = true; OBR.modal.close(MODAL_ESPELHO); }
    });
    frame.addEventListener("load", () => enviar({ tipo: "pedir" }));

    btnFechar.onclick = () => { fechandoDeVerdade = true; local({ tipo: "parar-espelho", sessao }); OBR.modal.close(MODAL_ESPELHO); };
    btnEncerrar.onclick = async () => { fechandoDeVerdade = true; await enviar({ tipo: "forcar-fechar" }, "ALL"); OBR.modal.close(MODAL_ESPELHO); };

    // Player fechou sem querer: o espelho volta sozinho
    window.addEventListener("pagehide", () => {
      if (!fechandoDeVerdade) local({ tipo: "reabrir-espelho", sessao });
    });
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !btnFechar.hidden) btnFechar.click();
  });

  frame.src = src;   // só carrega depois de tudo pronto, para não perder o "load"
});
</script>
</body></html>
